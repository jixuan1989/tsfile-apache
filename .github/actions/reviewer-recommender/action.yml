name: 'Module Reviewer Recommender'
description: >-
  Recommend and request PR reviewers based on the modules a PR touches,
  module-coupled history, and review records (git history + GitHub API).
inputs:
  github-token:
    description: 'Token with pull-requests:write (pass secrets.GITHUB_TOKEN)'
    required: true
  top-n:
    description: 'How many reviewers to request'
    required: false
    default: '3'
  window-days:
    description: 'History window in days'
    required: false
    default: '365'
  dry-run:
    description: 'Comment only, do not request reviewers (still posts comment)'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout full history
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Recommend reviewers
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        TOP_N: ${{ inputs.top-n }}
        WINDOW_DAYS: ${{ inputs.window-days }}
        DRY_RUN: ${{ inputs.dry-run }}
      run: |
        python3 "${{ github.action_path }}/reviewer_recommender/action_main.py"
