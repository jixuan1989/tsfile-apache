name: prr-legacy

on:
  pull_request_target:
    types: [opened, ready_for_review]
    # To run again when the PR gets new commits, add synchronize: the comment is edited in
    # place, and reviewers who were already requested stay requested.

permissions:
  contents: read
  pull-requests: write

jobs:
  recommend:
    # Drafts wait until they are marked ready for review (the ready_for_review event).
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # Runs of one pull request take turns, so that two of them cannot both find
    # no comment yet and each post one.
    concurrency:
      group: reviewer-recommend-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/reviewer-recommender
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: 'true'   # test: nobody is named
