name: reviewer-recommend

on:
  workflow_run:
    workflows: ["reviewer-signal"]
    types: [completed]

# Nothing at the top level: each job below asks for what it needs.
permissions: {}

jobs:
  # Finds the pull request and hands its number on. It comes before the job
  # that can write, so that the runs of one pull request can take turns.
  find:
    # Only a run of the signal workflow that a pull request started, and that
    # finished normally, gets a recommendation.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
      # This workflow always runs from the default branch, and the pull request
      # may come from anybody: nothing from the pull request may be checked out
      # or run here. The event contributes one value, the head commit, which
      # GitHub sets and a pull request cannot forge. It reaches the shell
      # through env: and is checked before it is used; the pull request itself
      # is looked up through the API.
      - name: Find the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::head sha is not a commit SHA"; exit 1; }
          # Also finds a pull request from a fork. An empty result is normal: the
          # author pushed again, so the head of the pull request has moved on,
          # and the push starts a run of its own. The search index can take a
          # moment to list a pull request that was just opened, so ask three
          # times before concluding that. A query that fails fails this step:
          # it must not read as "no pull request". The search ranks by how well
          # a pull request matches and lists 30 by default; 100 leaves room for
          # the one with this head commit not to be among the first.
          PR=
          for attempt in 1 2 3; do
            [ "$attempt" = 1 ] || sleep 10
            PR=$(gh pr list -R "$REPO" --state open --search "$HEAD_SHA" \
              --json number,headRefOid --limit 100 \
              --jq "[.[] | select(.headRefOid == \"$HEAD_SHA\")] | if length == 1 then .[0].number else empty end")
            [ -n "$PR" ] && break
          done
          # Two open pull requests can have the same head commit, a branch sent
          # to two branches. Nothing tells which one started this run, so that
          # counts as none: the comment must not land on the other one.
          [ -n "$PR" ] || echo "no single open pull request with head $HEAD_SHA: nothing to recommend"
          echo "number=$PR" >> "$GITHUB_OUTPUT"

      # Test only: what GitHub put into the event, and what the lookup made of it.
      - name: Test only, event
        env:
          RUN: ${{ tojson(github.event.workflow_run) }}
          PR_IN_EVENT: ${{ tojson(github.event.pull_request) }}
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          echo "workflow_run: $RUN"
          echo "pull_request in the event: $PR_IN_EVENT"
          echo "lookup found pull request number: [$NUMBER]"

  recommend:
    needs: find
    if: needs.find.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Two runs of one pull request, such as a draft marked ready for review as
    # soon as it is opened, take turns. At the same time, both could find no
    # comment of theirs yet and each post one.
    concurrency:
      group: reviewer-recommend-${{ needs.find.outputs.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Test only: stands in for the action. The pause makes runs of one pull
      # request overlap, which is what the concurrency group has to absorb.
      - env:
          NUMBER: ${{ needs.find.outputs.number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "start $(date -u +%FT%T.%N) pull request $NUMBER head ${HEAD_SHA:0:8}"
          sleep 40
          echo "end $(date -u +%FT%T.%N) pull request $NUMBER head ${HEAD_SHA:0:8}"
